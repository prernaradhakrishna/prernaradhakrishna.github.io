<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Why do we remember what we want to know?</title>
  <style>
    .big  { font-family: Georgia, 'Times New Roman', serif; font-size: 72px; font-weight: 700; fill: currentColor; }
    .med  { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: 700; fill: currentColor; }
    .sm   { font-family: Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 400; font-style: italic; fill: currentColor; opacity: 0.6; }
    .tag  { font-family: monospace; font-size: 11px; fill: currentColor; opacity: 0.4; letter-spacing: 2px; }
    .line { stroke: currentColor; stroke-width: 2; }
  </style>

  <line class="line" x1="0" y1="30" x2="640" y2="30"/>
  <text class="big" x="0" y="108">why do we</text>
  <text class="big" x="0" y="182">remember</text>
  <text class="med" x="0" y="242">what we want</text>
  <text class="sm"  x="0" y="284">to know?</text>
  <text class="tag" x="640" y="310" text-anchor="end">P. RADHAKRISHNA</text>
  <line class="line" x1="0" y1="318" x2="640" y2="318"/>
</svg>
